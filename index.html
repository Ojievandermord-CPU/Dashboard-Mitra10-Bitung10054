/* ---------- login protection: 3 failed attempts = 30s cooldown (per browser) ---------- */
const LOGIN_GUARD_KEY='m10_login_guard_v1';
let loginGuardTimer=null;
function getLoginGuard(){try{return JSON.parse(localStorage.getItem(LOGIN_GUARD_KEY)||'{}')}catch(e){return {}}}
function loginWaitLeft(){const g=getLoginGuard();return Math.max(0,Math.ceil(((g.until||0)-Date.now())/1000))}
function setLoginGuardUI(){
 const b=$('loginBtn'),m=$('lm');if(!b)return;
 const left=loginWaitLeft();
 if(left>0){b.disabled=true;b.textContent='Tunggu '+left+' detik';if(m)m.textContent='Terlalu banyak percobaan login gagal. Silakan tunggu '+left+' detik sebelum mencoba kembali.'}
 else if(!b.dataset.busy){b.disabled=false;b.textContent='Masuk'}
 if(loginGuardTimer){clearInterval(loginGuardTimer);loginGuardTimer=null}
 if(left>0)loginGuardTimer=setInterval(()=>{const n=loginWaitLeft();if(n>0){b.disabled=true;b.textContent='Tunggu '+n+' detik';if(m)m.textContent='Silakan tunggu '+n+' detik sebelum mencoba login kembali.'}else{clearInterval(loginGuardTimer);loginGuardTimer=null;localStorage.removeItem(LOGIN_GUARD_KEY);b.disabled=false;b.textContent='Masuk';if(m)m.textContent='Waktu tunggu selesai. Silakan coba login kembali.'}},250);
}
function recordLoginFailure(){
 const g=getLoginGuard();g.count=(g.count||0)+1;
 if(g.count>=3){g.count=0;g.until=Date.now()+30000;localStorage.setItem(LOGIN_GUARD_KEY,JSON.stringify(g));setLoginGuardUI();return true}
 localStorage.setItem(LOGIN_GUARD_KEY,JSON.stringify(g));return false;
}
function resetLoginGuard(){try{localStorage.removeItem(LOGIN_GUARD_KEY)}catch(e){}if(loginGuardTimer){clearInterval(loginGuardTimer);loginGuardTimer=null}}

/* ---------- LEADERBOARD FU BERDASARKAN PERIODE ---------- */
function fuLeaderboard(period){const now=new Date();let start,end;if(period==='today'){start=new Date(now.getFullYear(),now.getMonth(),now.getDate());end=new Date(start);end.setDate(end.getDate()+1)}else if(period==='month'){start=new Date(now.getFullYear(),now.getMonth(),1);end=new Date(now.getFullYear(),now.getMonth()+1,1)}else if(period==='year'){start=new Date(now.getFullYear(),0,1);end=new Date(now.getFullYear()+1,0,1)}else{start=new Date(now.getFullYear()-1,0,1);end=new Date(now.getFullYear(),0,1)}const lo=start.getTime(),hi=end.getTime(),groups={};(S.fuHistory||[]).forEach(r=>{const t=new Date(r.fu_at).getTime();if(!r.fu_at||t<lo||t>=hi)return;const key=r.fu_by||r.fu_email||'Tidak diketahui';(groups[key]=groups[key]||[]).push(r)});return Object.entries(groups).map(([name,rows])=>({name,rows,total:rows.length})).sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name))}
function fuBoardHtml(period,title){const L=fuLeaderboard(period);return `<div class="card"><h3>${title}</h3>${tbl(['Peringkat','Nama Sales','Total FU'],L.slice(0,10).map((x,i)=>[i+1,`<button class="lnk" onclick="salesFuDetail(decodeURIComponent('${encodeURIComponent(x.name)}'),'${period}')">${esc(x.name)}</button>`,x.total]),'320px')}</div>`}

 ${ed?`<div class="card" style="margin-top:14px"><h3>Approval akun</h3>${MODE=='cl'?'<p class="mu">Akses diatur lewat tombol <b>Share</b> di claude.ai: undang email sales sebagai <b>Contributor</b> (agar bisa follow up). Cabut akses = kick.</p>':''}<div class="flt"><input placeholder="🔍 Cari nama / email user" value="${esc(S.uq||'')}" oninput="S.uq=this.value;filtU()"><select onchange="S.us=this.value;filtU()"><option value="">Semua status</option><option value="pending" ${S.us=='pending'?'selected':''}>Menunggu persetujuan</option><option value="approved" ${S.us=='approved'?'selected':''}>Disetujui</option><option value="blocked" ${S.us=='blocked'?'selected':''}>Diblokir</option></select> <small class="mu">${(S.users||[]).filter(u=>u.status==='pending').length} menunggu persetujuan</small></div><div id="utb">${tbl(['Email','Nama','Role','Status','Aksi'],(S.users||[]).map(u=>[esc(u.email),esc(u.name||''),u.role,u.status,uAct(u)]),'260px')}</div></div>`:''}
 ${isOw()?`<div class="card" style="margin-top:14px"><h3>🛡 Log aktivitas seluruh pengguna (Owner)</h3>${tbl(['Waktu','User','Aksi','Detail'],S.act.map(a=>[new Date(a.at).toLocaleString('id-ID'),esc(a.email),/PERCOBAAN/.test(a.action)?'<span class="no">❌ '+esc(a.action)+'</span>':esc(a.action),esc(a.detail)]),'380px')}</div>`:'<p class="mu">Log aktivitas hanya terlihat oleh Owner.</p>'}`};

function filtU(){const q=(S.uq||'').toLowerCase(),st=S.us||'';document.querySelectorAll('#utb table tr').forEach((r,i)=>{if(!i)return;const t=r.innerText.toLowerCase();r.style.display=(!q||t.includes(q))&&(!st||t.includes(st))?'':'none'})}
let _busy=false;
function uAct(u){if(u.role==='owner')return '<span class="mu">Owner (dilindungi)</span>';if(!isOw()&&u.role!=='member')return '<span class="mu">Hanya Owner</span>';
 const ap=u.status==='approved',bl=u.status==='blocked',dis='disabled style="opacity:.45;cursor:not-allowed"';
 return `<button class="b ${ap?'x':'g'}" ${ap?dis:''} onclick="setU('${u.id}','approved')">${ap?'✔ Disetujui':'Approve'}</button> <button class="b ${bl?'x':'r'}" ${bl?dis:''} onclick="setU('${u.id}','blocked')">${bl?'⛔ Diblokir':'Kick'}</button> ${isOw()&&ap&&u.role==='member'?`<button class="b x" onclick="setRole('${u.id}','editor')">⭐ Jadikan Editor</button>`:''}${u.role==='editor'?' <span class="chip cB">Editor</span>'+(isOw()?` <button class="b x" onclick="setRole('${u.id}','member')">↩ Jadikan Member</button>`:''):''}${isOw()?` <button class="b r" onclick="delUser('${u.id}')">🗑 Hapus Akun</button>`:''}`}
async function setU(id,st){if(_busy)return;const u=(S.users||[]).find(x=>x.id==id);if(!u||u.status===st||u.role==='owner'||(!isOw()&&u.role!=='member'))return;_busy=true;
 try{u.status=st;render(true);await BE.setUser(id,{status:st});await BE.log(st==='approved'?'APPROVE':'KICK',u.email)}finally{_busy=false}}
async function setRole(id,to){to=to||'editor';if(_busy)return;const u=(S.users||[]).find(x=>x.id==id);if(!u||!isOw()||u.role==='owner'||u.role===to)return;_busy=true;
 try{u.role=to;render(true);await BE.setUser(id,{role:to});await BE.log(to==='editor'?'JADIKAN EDITOR':'JADIKAN MEMBER',u.email)}finally{_busy=false}}
async function kickOut(st){S.user=null;try{await sb.auth.signOut()}catch(e){}charts.forEach(c=>c.destroy());charts=[];showLogin(st==='blocked'?'Akses Anda dicabut oleh Owner/Editor.':'Akun Anda tidak lagi disetujui.')}
async function upl(files){if(!isEd())return deny('Upload data');files=[...files];if(!files.length)return;toast('Memproses file… mohon tunggu 20-60 detik');await new Promise(r=>setTimeout(r,60));
 try{let j=null,SR=null,K=null;for(const f of files){if(/\.json$/i.test(f.name)){j=JSON.parse(await f.text());continue}
   const buf=await f.arrayBuffer();let wb=XLSX.read(buf,{type:'array',sheets:['Member','Bispro','Ots Nota penjualan']});
   if(wb.SheetNames.includes('Member')&&wb.SheetNames.includes('Bispro')){const g=n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});K={M:g('Member'),B:g('Bispro'),O:g('Ots Nota penjualan')}}
   else{wb=XLSX.read(buf,{type:'array',sheets:0});SR=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null})}}
  if(!j){if(!SR||!K)return toast('Pilih KEDUA file Excel: Kontrol After Sales + Sales Detail','bad');j=buildData(SR,K.M,K.B,K.O)}
  if(!j.members||!j.members.length)throw 0;D=j;prep();S.up={at:new Date().toISOString(),by:S.user.name};await BE.saveData(j);await BE.setting('last_upload',S.up);BE.log('UPLOAD DATA',files.map(f=>f.name).join(', '));toast('Data berhasil di-upload & tersinkron ke semua pengguna');render()}catch(e){console.error(e);toast('File tidak valid / gagal diproses','bad')}}
document.addEventListener('copy',e=>{});addEventListener('keydown',e=>{if(S.user&&!isEd()&&(e.ctrlKey||e.metaKey)&&['s','p'].includes(e.key.toLowerCase())){e.preventDefault();deny('Download / cetak halaman')}});
/* ---------- pemisahan Data Member (>1x) dan Belum / 1x Transaksi ---------- */
function pager(n,P){const pages=Math.ceil(n/P)||1;return '<div class="flt" style="margin-top:10px"><button class="b x" onclick="S.pg=Math.max(0,S.pg-1);render()">◀</button> Hal '+(S.pg+1)+'/'+pages+' <button class="b x" onclick="S.pg=Math.min('+(pages-1)+',S.pg+1);render()">▶</button></div>'}
V.member=()=>{const L=msort(filt()),P=50;return '<h2>Data Member <small class="mu">('+(S.f.all?'semua member termasuk 1x':'transaksi lebih dari 1x')+' · '+L.length.toLocaleString('id-ID')+' member)</small></h2>'+(S.f.all?'<p><span class="chip cC">Menampilkan semua member termasuk yang 1x</span> <button class="lnk" onclick="go(\'member\',{})">Kembali ke transaksi lebih dari 1x</button></p>':'')+flt()+tbl(MH,memRows(L.slice(S.pg*P,S.pg*P+P)),'620px')+pager(L.length,P)};
V.belum=()=>{const one=D.members.filter(m=>m.tc===1),L=msort(filt()),P=50,nq=(S.nq||'').toLowerCase(),N=D.new.filter(x=>!nq||String(x[0]).includes(nq)||String(x[1]).toLowerCase().includes(nq)||String(x[2]).includes(nq));
 return '<h2>Member Belum Transaksi / Baru 1x Transaksi</h2><div class="grid">'+kpi('Belum pernah transaksi',D.new.length,'n',"")+kpi('Transaksi 1x',one.length,'n',"",'Sudah FU: '+one.filter(fuOf).length)+'</div>'+
 '<h3 style="margin-top:14px">Member transaksi 1x <small class="mu">('+L.length.toLocaleString('id-ID')+' member sesuai filter)</small></h3>'+flt()+tbl(MH,memRows(L.slice(S.pg*P,S.pg*P+P)),'520px')+pager(L.length,P)+
 '<div class="card" style="margin-top:14px"><h3>Belum pernah transaksi ('+N.length.toLocaleString('id-ID')+')</h3><div class="flt"><input placeholder="Cari nama / no member / HP" value="'+esc(S.nq||'')+'" onchange="S.nq=this.value;render()"></div>'+
 tbl(['No Member','Nama','WhatsApp'],N.slice(0,100).map(x=>[x[0],esc(x[1]),x[2]?'<a class="b g" target="_blank" href="https://wa.me/'+ph(x[2])+'?text='+encodeURIComponent(S.script.replace(/{nama}/g,x[1]).replace(/{item}/g,'belanja Anda').replace(/{sales}/g,'Tim Mitra10 Bitung Cikupa').replace(/{pic}/g,'-').replace(/{pdd}/g,'-'))+'">💬 '+esc(x[2])+'</a>':'-']),'260px')+(N.length>100?'<small class="mu">Menampilkan 100 pertama, gunakan pencarian untuk mempersempit.</small>':'')+'</div>'};

loadEmb().then(j=>{D=j;boot()}).catch(e=>{document.getElementById('login').innerHTML='<p style="margin:auto;color:#fca5a5;padding:30px">Browser tidak mendukung pembukaan data terkompres. Gunakan Chrome/Edge/Safari versi terbaru.</p>'});
